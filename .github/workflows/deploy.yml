# Simpan file ini di: .github/workflows/deploy.yml
# Registry: GHCR (ghcr.io) -- private package gratis tanpa batas jumlah,
# autentikasi memakai GITHUB_TOKEN bawaan Actions, tidak perlu secret tambahan.
# Build lokal di laptop tetap bebas memakai Podman, image yang dihasilkan
# tetap OCI-compliant sehingga tidak ada masalah kompatibilitas dengan Docker.
# Job "deploy" berjalan di self-hosted runner Windows, sehingga memakai
# sintaks PowerShell (pwsh), bukan bash.
#
# Alur: security -> test -> build (push) -> deploy
#   security : SAST (Semgrep), secret scan (Gitleaks), SCA (Trivy fs)
#   test     : unit test, npm audit, SBOM, scan image (Trivy), DAST (ZAP baseline)
#   build    : push image ke GHCR, sign (Cosign) dan provenance (SLSA),
#              hanya jika security dan test lolos
#   deploy   : policy admission (registry, tanda tangan, provenance) lalu deploy
#              berdasarkan digest yang terverifikasi

name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # GHCR mewajibkan nama image huruf kecil semua.
  IMAGE_NAME: ghcr.io/kel-2-wdevsecops/be
  APP_PORT: 3008

jobs:
  security:
    name: Security (SAST, Secret Scan, SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0 # gitleaks perlu seluruh riwayat commit

      - name: SAST scan dengan Semgrep
        run: |
          pip install semgrep --quiet
          semgrep --config=p/owasp-top-ten --config=p/nodejs --error .

      - name: Secret scan dengan Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SCA scan dependency dengan Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  test:
    name: Test (Unit, SBOM, Image Scan, DAST)
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Unit test
        run: npm test --if-present

      - name: Audit dependency production
        run: npm audit --omit=dev --audit-level=high

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: Build image lokal untuk pengujian
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:test

      - name: Scan image dengan Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Jalankan container untuk DAST
        run: |
          docker run -d --name app -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            -e PORT=${{ env.APP_PORT }} ${{ env.IMAGE_NAME }}:test
          for i in $(seq 1 15); do
            curl -fs http://localhost:${{ env.APP_PORT }}/api/v1/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: DAST dengan OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:${{ env.APP_PORT }}
          allow_issue_writing: false
          fail_action: false # ubah ke true setelah temuan awal dibereskan
          artifact_name: zap-report

      - name: Hentikan container
        if: always()
        run: docker rm -f app

  build:
    name: Build dan push image
    needs: [security, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write     # identitas OIDC untuk Cosign keyless dan attestation
      attestations: write # menyimpan attestation provenance
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout kode
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dan push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Pasang Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image dengan Cosign (keyless)
        run: cosign sign --yes ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Buat attestation provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: build
    runs-on: self-hosted
    env:
      # Hanya tanda tangan dari workflow ini, di branch main, yang dipercaya.
      SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Checkout kode
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Login ke GHCR di server
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pasang Cosign
        uses: sigstore/cosign-installer@v3

      - name: Policy admission - registry dan digest
        shell: powershell
        run: |
          if (-not "${{ env.IMAGE_NAME }}".StartsWith("ghcr.io/kel-2-wdevsecops/")) {
            Write-Host "DITOLAK: image bukan dari registry yang diizinkan."
            exit 1
          }
          if ("$env:IMAGE_DIGEST" -notmatch '^sha256:[0-9a-f]{64}$') {
            Write-Host "DITOLAK: digest image tidak valid atau kosong."
            exit 1
          }
          Write-Host "Kebijakan registry dan digest terpenuhi."

      - name: Policy admission - verifikasi tanda tangan
        shell: powershell
        run: |
          cosign verify "${{ env.IMAGE_NAME }}@$env:IMAGE_DIGEST" `
            --certificate-identity "$env:SIGNER_IDENTITY" `
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "DITOLAK: tanda tangan image tidak valid."
            exit 1
          }

      - name: Policy admission - verifikasi provenance
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://${{ env.IMAGE_NAME }}@$env:IMAGE_DIGEST" --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "DITOLAK: provenance image tidak valid."
            exit 1
          }

      - name: Validasi compose.yaml sebelum diterapkan
        shell: powershell
        run: docker compose -f "$env:GITHUB_WORKSPACE\compose.yaml" config --quiet

      - name: Sinkronkan compose.yaml ke server jika ada perubahan
        shell: powershell
        run: |
          $sumber = Get-FileHash "$env:GITHUB_WORKSPACE\compose.yaml"
          $tujuanAda = Test-Path "D:\.server\kuliah\d4\devsecops\uts\compose.yaml"
          $tujuan = if ($tujuanAda) { Get-FileHash "D:\.server\kuliah\d4\devsecops\uts\compose.yaml" } else { $null }

          if (-not $tujuanAda -or $sumber.Hash -ne $tujuan.Hash) {
            Write-Host "Konfigurasi berbeda, menyalin versi baru ke server."
            Copy-Item -Path "$env:GITHUB_WORKSPACE\compose.yaml" -Destination "D:\.server\kuliah\d4\devsecops\uts\compose.yaml" -Force
          } else {
            Write-Host "Tidak ada perubahan pada compose.yaml, penyalinan dilewati."
          }

      - name: Pull image yang sudah terverifikasi (berdasarkan digest)
        shell: powershell
        run: |
          docker pull "${{ env.IMAGE_NAME }}@$env:IMAGE_DIGEST"
          # compose memakai :latest, arahkan ke image terverifikasi tersebut
          docker tag "${{ env.IMAGE_NAME }}@$env:IMAGE_DIGEST" "${{ env.IMAGE_NAME }}:latest"

      - name: Deploy dengan docker compose
        shell: powershell
        run: |
          cd D:\.server\kuliah\d4\devsecops\uts
          # --pull never: jangan menarik ulang latest dari registry
          docker compose up -d --pull never BE

      - name: Health check
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 5; $i++) {
            Start-Sleep -Seconds 5
            curl.exe -fs http://localhost:3008/api/v1/health
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Aplikasi sehat."
              $success = $true
              break
            }
            Write-Host "Percobaan $i gagal, mencoba lagi..."
          }
          if (-not $success) {
            Write-Host "Aplikasi tidak merespons setelah 5 kali percobaan."
            exit 1
          }

      - name: Notifikasi sukses
        if: success()
        shell: powershell
        run: |
         curl.exe -d "Deploy berhasil: commit ${{ github.sha }}" ntfy.sh/Deploy-Success

      - name: Notifikasi gagal
        if: failure()
        shell: powershell
        run: |
         curl.exe -d "Deploy GAGAL: commit ${{ github.sha }}" ntfy.sh/Deploy-Failure
